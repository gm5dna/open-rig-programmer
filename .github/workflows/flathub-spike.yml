#
# Spike only: does org.gnome.Sdk//50 (fallback 49) carry webkit2gtk-4.1 +
# Go, for the Flathub submission plan (phase0-webkit.md). Not part of the
# release pipeline.
name: flathub-spike

on:
  workflow_dispatch:
  push:
    branches: [flathub-spike]

permissions:
  contents: read

jobs:
  probe-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install SDK/Platform 50, fall back to 49
        run: |
          if sudo flatpak install -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50; then
            echo "RUNTIME_VERSION=50" >> "$GITHUB_ENV"
          else
            echo "50 failed, falling back to 49"
            sudo flatpak install -y --noninteractive flathub org.gnome.Sdk//49 org.gnome.Platform//49
            echo "RUNTIME_VERSION=49" >> "$GITHUB_ENV"
          fi

      - name: Probe SDK contents
        run: |
          echo "== installed runtime version: ${RUNTIME_VERSION} =="
          flatpak remote-info flathub org.gnome.Platform//50 || true
          flatpak remote-info flathub org.gnome.Platform//49 || true
          flatpak list --runtime
          flatpak run --command=sh "org.gnome.Sdk//${RUNTIME_VERSION}" -c '
            pkg-config --modversion webkit2gtk-4.1 gtk+-3.0 javascriptcoregtk-4.1 || echo "pkg-config: not found"
            ls /usr/lib/*/libwebkit2gtk-4.1.so* || echo "libwebkit2gtk-4.1: not found"
            go version || echo "no go"
            node --version || echo "no node"
          '
