name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS restored 16/08/2026: the repo is public, Actions minutes are free.
        # windows-2025 added 05/09/2026: the first place this project's Go
        # tests run on Windows at all (Tier 0 P2 decision 13,
        # docs/superpowers/specs/2026-09-04-windows-packaging-design.md).
        # This leg was EXPECTED RED when planned, on tests that compared
        # filepath.Join results against `/`-literal expectations and one
        # 0600-permission assertion with no Windows guard; the win-code
        # lane fixed those ahead of this leg landing, following the
        # userconfig precedent's Windows skip for the permission bit
        # ("never weaken a claim the platform can express") — that lane
        # could not observe this leg's result at the time, so the fix
        # was not claimed proven here until the leg actually ran (plan
        # decision 13). It was green first time on 05/09/2026 (run
        # 33949596071) and every run since, because the Windows-hostile
        # expectations were fixed beforehand. Anything the platform
        # still surfaces that this plan did not predict becomes a
        # ledgered win-code follow-up.
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    # Job-level, so it caps all three matrix legs, not only windows-2025 —
    # chosen because Windows is the slowest of the three (the plan's value).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed private fixtures
        if: runner.os == 'Linux'
        run: |
          if git ls-files | grep -iE '(^|/)fixtures-private/|\.memlist$|(^|/)memory[^/]*\.dat$|\.private-capture$'; then
            echo '::error::Tracked file matches private-fixture pattern'; exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Check frontend (svelte-check)
        working-directory: app/frontend
        run: npm run check

      - name: Test frontend
        working-directory: app/frontend
        run: npm run test

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: go vet
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=webkit2_41' || '' }}
        run: go vet ./...

      - name: go test
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=webkit2_41' || '' }}
        run: go test ./...

      - name: Add Go bin to PATH
        # Explicit shell: bash — this job's default shell on windows-2025
        # is pwsh, which does not run the $(...) command substitution
        # below the way this step needs.
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: wails build (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: wails build -tags webkit2_41

      - name: GUI launch check (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          # Headless runners have no GPU; WebKitGTK's DMA-BUF renderer
          # can abort under Xvfb's software X. CI-only workaround; real
          # desktops don't need it.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          # shellcheck disable=SC2016
          # (single quotes are deliberate: the inner `bash -c` string must not expand on the outer shell)
          xvfb-run -a bash -c '
            set -u
            app/build/bin/open-rig-programmer & pid=$!
            sleep 10
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::GUI exited within 10s of launch"
              wait "$pid" || true
              exit 1
            fi
            kill -TERM "$pid"
            wait "$pid"; status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
              echo "::error::GUI exited with status $status after SIGTERM"
              exit 1
            fi
            echo "GUI launched, survived 10s, and terminated cleanly"'

      - name: wails build (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: wails build

      - name: wails build (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        # No -nsis here: NSIS isn't installed on this leg (that only
        # happens in release.yml's `windows` job, which needs it to make
        # the installer); this leg only proves the GUI itself still
        # compiles on Windows. No GUI launch check either — three stacked
        # unverified premises (WebView2 present, Wine-free Windows-native
        # launch semantics under a headless runner, a fake radio),
        # deliberately left to the VM leg, which launches the real thing.
        run: wails build
