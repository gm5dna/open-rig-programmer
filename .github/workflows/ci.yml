name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is dropped while the repo is private: macOS runners
        # bill minutes at a 10x multiplier and duplicate the local macOS
        # development gate. Restore it after the public flip, when Actions
        # is free.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against committed private fixtures
        if: runner.os == 'Linux'
        run: |
          if git ls-files | grep -iE '(^|/)fixtures-private/|\.memlist$|(^|/)memory[^/]*\.dat$|\.private-capture$'; then
            echo '::error::Tracked file matches private-fixture pattern'; exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Check frontend (svelte-check)
        working-directory: app/frontend
        run: npm run check

      - name: Test frontend
        working-directory: app/frontend
        run: npm run test

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: go vet
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=webkit2_41' || '' }}
        run: go vet ./...

      - name: go test
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=webkit2_41' || '' }}
        run: go test ./...

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: wails build (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: wails build -tags webkit2_41

      - name: GUI launch check (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          # Headless runners have no GPU; WebKitGTK's DMA-BUF renderer
          # can abort under Xvfb's software X. CI-only workaround; real
          # desktops don't need it.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          xvfb-run -a bash -c '
            set -u
            app/build/bin/open-rig-programmer & pid=$!
            sleep 10
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::GUI exited within 10s of launch"
              wait "$pid" || true
              exit 1
            fi
            kill -TERM "$pid"
            wait "$pid"; status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
              echo "::error::GUI exited with status $status after SIGTERM"
              exit 1
            fi
            echo "GUI launched, survived 10s, and terminated cleanly"'

      - name: wails build (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: wails build
