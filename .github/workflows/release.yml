# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release packaging for open-rig-programmer. Triggered by pushing a
# `v*` tag. Builds the rigprog CLI (darwin-universal via `lipo`,
# linux-amd64, linux-arm64) and the desktop GUI (darwin universal .app,
# zipped; linux amd64+arm64 .deb packages), computes a SHA256SUMS file
# over every artefact, and publishes everything to a DRAFT GitHub
# release for a human to review before publishing.
#
# The release stays a DRAFT: this workflow never runs
# `gh release edit --draft=false`. Building the artefacts here proves
# the packaging pipeline works; whether any of them ship is a separate,
# human decision taken against the recorded evidence. The current
# state of the project's Linux hardware verification is written down in
# docs/linux-setup.md (with docs/hardware-notes.md as the wider
# real-radio record) — read it before publishing a draft that carries
# Linux artefacts.
#
# go.bug.st/serial (this project's only serial-port dependency) is pure
# Go on Linux — its enumerator package's Linux implementation
# (go.bug.st/serial/enumerator's usb_linux.go) reads /sys/bus/usb
# directly with no cgo — so the Linux CLI builds with CGO_ENABLED=0
# (confirmed locally: GOOS=linux GOARCH=amd64/arm64 CGO_ENABLED=0 go
# build ./cmd/rigprog succeeds both arches). The same package's darwin
# implementation (usb_darwin.go) DOES use cgo (IOKit), so the darwin CLI
# build needs CGO_ENABLED=1 explicitly — Go disables cgo by default for
# a cross-arch build even on a matching OS (building the amd64 slice on
# an arm64 runner, or vice versa), so leaving CGO_ENABLED unset would
# silently drop the enumerator's darwin backend and fail to link.
#
# Windows: go.bug.st/serial's Windows implementation is also cgo-free,
# but its two halves differ: the port (serial_windows.go) is
# CreateFile/DCB/overlapped I/O via golang.org/x/sys/windows and
# syscall, while the enumerator (enumerator/usb_windows.go) is a
# setupapi walk plus a USB hub IOCTL, reached via
# windows.NewLazySystemDLL("setupapi.dll") — no cgo either way, so the
# `windows` job below builds both CLI arches with CGO_ENABLED=0.
# windows-2025 ships no NSIS (Windows2025-Readme, read 04/09/2026), so the
# job fetches the official 3.12 distribution zip, verifies it against a
# pinned sha256, and puts it on PATH as a WINDOWS-NATIVE path
# (`${GITHUB_WORKSPACE}\nsis-3.12`) rather than the MSYS-style path Git
# Bash would otherwise put there: Go's `exec.LookPath`, which `wails build
# -nsis` uses to find `makensis`, cannot see an MSYS `/d/a/...` path, and
# `wails build -nsis` prints a warning and exits 0 with no installer if it
# fails to find one — a silent, not a loud, failure. NSIS's
# VIProductVersion and the PE VERSIONINFO both need a plain X.Y.Z number,
# so this job stamps `app/wails.json`'s info.productVersion from the tag
# before building (the committed file deliberately omits it, the same
# reasoning as the darwin job's Info.plist stamp below). arm64 is
# CROSS-compiled on this x64 host: `wails build -platform
# windows/amd64,windows/arm64 -nsis` builds both GUI installers in one
# process and the arm64 slice is never run in THIS job — only the
# amd64 CLI is run here. The arm64 GUI this job builds HAS since been
# launched by a person, on the 05/09/2026 Windows 11 ARM64 VM session
# (docs/hardware-notes.md's "Windows (ARM64 VM) session" section) —
# from a separately downloaded rehearsal build, not from this job
# directly. The amd64 GUI has not: register W12 (spec decision 1)
# stays ASSUMED.
# This job also asserts the tag matches this
# workflow's own trigger shape (`^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$`,
# tighter than the `on.push.tags: v*` glob below) before building anything
# — deliberately the whole release's gate, since no other job here has
# ever checked the tag is well-formed before using it.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

env:
  VERSION: ${{ github.ref_name }}
  WAILS_VERSION: v2.13.0
  # Link-time version stamp. Every Go build below sets
  # -X <VERSION_PKG>.version=<tag>; without it the artefact reports
  # "dev (unreleased build)" — see internal/buildinfo. Each job that can
  # RUN what it just built asserts the stamp landed, because a dropped
  # ldflags is otherwise silent until a user reads the version off a
  # release binary and finds "dev".
  VERSION_PKG: github.com/gm5dna/open-rig-programmer/internal/buildinfo

jobs:
  cli-darwin-universal:
    runs-on: macos-latest
    # Present only on the upstream repo (a fork's secrets are empty
    # strings) — every signing step below is gated on this, so a run
    # with no cert builds and ships an unsigned binary unchanged.
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12_BASE64" | base64 -D -o cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          rm -f cert.p12

      - name: Build amd64 slice
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o dist/rigprog-amd64 ./cmd/rigprog

      - name: Build arm64 slice
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o dist/rigprog-arm64 ./cmd/rigprog

      - name: lipo -create universal binary
        run: |
          lipo -create -output dist/rigprog dist/rigprog-amd64 dist/rigprog-arm64
          rm dist/rigprog-amd64 dist/rigprog-arm64
          archs="$(lipo -archs dist/rigprog)"
          echo "Universal binary architectures: $archs"
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64

      # Codesign only — no notarisation. Gatekeeper's quarantine gate
      # applies to quarantined app bundles and installer packages, not
      # a bare binary a user runs from a terminal (spec §A2), so a CLI
      # notarytool submission buys nothing here.
      - name: Codesign the CLI binary
        if: env.HAVE_CERT == 'true'
        run: |
          set -eu
          codesign --force --options runtime --timestamp --sign "Developer ID Application: Stuart Henderson (9PFBWD9BNF)" dist/rigprog
          codesign -dv --verbose=2 dist/rigprog

      - name: Verify the version stamp landed
        run: |
          set -eu
          chmod +x dist/rigprog
          reported="$(./dist/rigprog version | head -1 | cut -d' ' -f2)"
          echo "rigprog reports: ${reported} (tag: ${VERSION})"
          test "${reported}" = "${VERSION}"
          ! ./dist/rigprog version | grep -q 'unreleased build'

      - name: Package
        run: |
          chmod +x dist/rigprog
          tar -C dist -czf "rigprog-${VERSION}-darwin-universal.tar.gz" rigprog

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cli-darwin-universal
          path: rigprog-${{ env.VERSION }}-darwin-universal.tar.gz
          if-no-files-found: error

      - name: Delete signing keychain
        if: always() && env.HAVE_CERT == 'true'
        run: security delete-keychain build.keychain

  cli-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o dist/rigprog ./cmd/rigprog

      # amd64 only: the arm64 slice cannot run on this x86 runner. Both
      # arches take the same ldflags, so proving the stamp on the runnable
      # one proves the mechanism.
      - name: Verify the version stamp landed
        if: matrix.arch == 'amd64'
        run: |
          set -eu
          chmod +x dist/rigprog
          reported="$(./dist/rigprog version | head -1 | cut -d' ' -f2)"
          echo "rigprog reports: ${reported} (tag: ${VERSION})"
          test "${reported}" = "${VERSION}"
          ! ./dist/rigprog version | grep -q 'unreleased build'

      - name: Package
        run: |
          chmod +x dist/rigprog
          tar -C dist -czf "rigprog-${VERSION}-linux-${{ matrix.arch }}.tar.gz" rigprog

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: rigprog-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  gui-darwin-universal:
    runs-on: macos-latest
    # Present only on the upstream repo (a fork's secrets are empty
    # strings) — every signing/notarising step below is gated on this,
    # so a run with no cert falls through to today's ad-hoc path
    # unchanged.
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12_BASE64" | base64 -D -o cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          rm -f cert.p12

      - name: wails build (darwin/universal)
        working-directory: app
        env:
          # go.bug.st/serial's enumerator is cgo on darwin (same reason the
          # CLI universal build sets this explicitly) — do not rely on the
          # runner's default.
          CGO_ENABLED: '1'
        run: |
          set -u
          # `wails build` ends with its OWN ad-hoc codesign, and that step
          # can fail with "resource fork, Finder information, or similar
          # detritus not allowed" when the freshly-built binary carries
          # com.apple.provenance extended attributes. docs/developing.md
          # documents the identical failure in a local checkout, and a
          # local dry-run of this workflow (25/07/2026) reproduced it: the
          # .app is COMPLETE at that point — only the signature is missing
          # — and wails still exits 1.
          #
          # The very next step strips those xattrs and signs the bundle
          # properly, so a failure here is not fatal in itself. What IS
          # fatal is a missing or non-universal bundle, which is what the
          # checks below assert: a compile or frontend failure never
          # produces one, so nothing real is being swallowed.
          wails build -platform darwin/universal -ldflags "-X ${VERSION_PKG}.version=${VERSION}" || \
            echo "wails build exited non-zero — checking whether the bundle is nonetheless complete"

          app="build/bin/Open Rig Programmer.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/open-rig-programmer"
          archs="$(lipo -archs "$app/Contents/MacOS/open-rig-programmer")"
          echo "App binary architectures: $archs"
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64

      - name: Verify the version stamp landed
        working-directory: app
        run: |
          set -eu
          # The GUI cannot be asked its version from a shell, so this
          # inspects the binary instead — a weaker check than the CLI
          # jobs' `rigprog version`, and deliberately stated as such.
          LC_ALL=C grep -qa -- "${VERSION}" "build/bin/Open Rig Programmer.app/Contents/MacOS/open-rig-programmer"
          echo "version string ${VERSION} present in the .app binary"

      # Must run BEFORE the codesign step: signing seals the bundle's
      # resources, and Info.plist is one of them.
      - name: Stamp the bundle version into Info.plist
        working-directory: app
        run: |
          set -eu
          # wails.json's info block deliberately omits productVersion —
          # a static version there would drift from the tag — so wails
          # falls back to its own default of "1.0.0", right for the
          # v1.0.0 tag and wrong for every tag after it. The tag is the
          # single source of truth, applied here (leading "v" stripped:
          # CFBundle* version keys are conventionally bare).
          plist="build/bin/Open Rig Programmer.app/Contents/Info.plist"
          bundle_version="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${bundle_version}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${bundle_version}" "$plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist"

      - name: Ad-hoc codesign
        if: env.HAVE_CERT != 'true'
        working-directory: app
        run: |
          xattr -cr "build/bin/Open Rig Programmer.app"
          codesign --force --deep -s - "build/bin/Open Rig Programmer.app"
          codesign -dv --verbose=2 "build/bin/Open Rig Programmer.app"

      - name: Developer ID codesign
        if: env.HAVE_CERT == 'true'
        working-directory: app
        run: |
          set -eu
          xattr -cr "build/bin/Open Rig Programmer.app"
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application: Stuart Henderson (9PFBWD9BNF)" "build/bin/Open Rig Programmer.app"
          codesign -dv --verbose=2 "build/bin/Open Rig Programmer.app"

      - name: Zip the .app
        working-directory: app/build/bin
        run: zip -r -y "../../../open-rig-programmer-${VERSION}-darwin-universal.app.zip" "Open Rig Programmer.app"

      # Staple the notarisation ticket to the .app itself (not the
      # zip — Apple's own guidance), then re-zip so the artefact
      # uploaded below carries the stapled bundle. `spctl`/`codesign`
      # at the end land the acceptance evidence in the CI log (spec
      # §A3); a fresh unzip-and-double-click Gatekeeper test still
      # needs a human (real-machine step, not provable in CI).
      - name: Notarise the app
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          zip="open-rig-programmer-${VERSION}-darwin-universal.app.zip"
          app="app/build/bin/Open Rig Programmer.app"
          submission="$(xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json)"
          echo "$submission"
          id="$(echo "$submission" | jq -r '.id')"
          status="$(echo "$submission" | jq -r '.status')"
          echo "notarytool submission ${id}: ${status}"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -f "$zip"
          (cd app/build/bin && ditto -c -k --keepParent "Open Rig Programmer.app" "../../../${zip}")
          spctl -a -vv -t exec "$app"
          codesign -dv --verbose=2 "$app"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: gui-darwin-universal
          path: open-rig-programmer-${{ env.VERSION }}-darwin-universal.app.zip
          if-no-files-found: error

      - name: Delete signing keychain
        if: always() && env.HAVE_CERT == 'true'
        run: security delete-keychain build.keychain

  gui-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        # ubuntu-24.04 pinned (not ubuntu-latest): the deb's dependency
        # names are verified against the noble archive, and the arm64
        # leg is noble — the amd64 build should target the same ABI
        # rather than float when ubuntu-latest moves on.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: wails build (linux/${{ matrix.arch }})
        working-directory: app
        env:
          # The GUI links GTK and WebKit through cgo — do not rely on the
          # runner's default, the same reason the darwin GUI job sets this.
          CGO_ENABLED: '1'
        run: wails build -tags webkit2_41 -ldflags "-X ${VERSION_PKG}.version=${VERSION}"

      - name: Version stamp present in the GUI binary
        run: |
          if LC_ALL=C grep -qa -- "${VERSION}" app/build/bin/open-rig-programmer; then
            echo "version string ${VERSION} present in the GUI binary"
          else
            echo "FAIL: version string not found in the GUI binary" >&2
            exit 1
          fi

      - name: Build rigprog (linux/${{ matrix.arch }})
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o app/dist/rigprog ./cmd/rigprog

      - name: rigprog reports the tag as its version
        run: |
          set -eu
          reported="$(app/dist/rigprog version | head -1 | cut -d' ' -f2)"
          echo "rigprog reports: ${reported} (tag: ${VERSION})"
          test "${reported}" = "${VERSION}"
          ! app/dist/rigprog version | grep -q 'unreleased build'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Package .deb
        working-directory: app
        env:
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          NFPM_VERSION="${VERSION#v}" nfpm package -f build/linux/nfpm.yaml -p deb \
            -t "../open-rig-programmer_${VERSION#v}_${NFPM_ARCH}.deb"

      - name: Check the .deb
        run: bash app/build/linux/check-deb.sh "open-rig-programmer_${VERSION#v}_${{ matrix.arch }}.deb" "${VERSION#v}" "${{ matrix.arch }}"

      - name: Package .rpm
        working-directory: app
        env:
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # rpm forbids "-" in the Version header (unlike the .deb
          # above, which is fine with one) — split a prerelease tag
          # (1.8.1-rc1) into Version/Release for rpm only; a published
          # tag (1.8.1, no hyphen) leaves NFPM_RELEASE unset and nfpm
          # defaults Release to "1". See nfpm.yaml's `release:` comment.
          RAW="${VERSION#v}"
          case "$RAW" in
            *-*) export NFPM_VERSION="${RAW%%-*}"; export NFPM_RELEASE="${RAW#*-}" ;;
            *) export NFPM_VERSION="$RAW" ;;
          esac
          # nfpm maps amd64/arm64 to x86_64/aarch64 for the rpm
          # Architecture header itself; the filename below matches
          # that so the artefact name and the metadata agree.
          case "${NFPM_ARCH}" in
            amd64) rpm_arch=x86_64 ;;
            arm64) rpm_arch=aarch64 ;;
          esac
          nfpm package -f build/linux/nfpm.yaml -p rpm \
            -t "../open-rig-programmer-${RAW}.${rpm_arch}.rpm"

      - name: Check the .rpm
        run: |
          case "${{ matrix.arch }}" in
            amd64) rpm_arch=x86_64 ;;
            arm64) rpm_arch=aarch64 ;;
          esac
          bash app/build/linux/check-rpm.sh "open-rig-programmer-${VERSION#v}.${rpm_arch}.rpm" "${VERSION#v}" "${{ matrix.arch }}"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-${{ matrix.arch }}
          path: |
            open-rig-programmer_*.deb
            open-rig-programmer-*.rpm
          if-no-files-found: error

  gui-linux-flatpak:
    # Independent of gui-linux above: this job builds its own wails
    # binary rather than reusing that job's artefact (which is a .deb,
    # not a bare binary), so nothing here can hold up the .deb build.
    # continue-on-error means a failure here still counts as "success"
    # for the release job's `needs` check below, so a flatpak-specific
    # break (a Flathub outage, a flatpak-builder regression) never
    # blocks the .deb, tarballs or installers from reaching the draft
    # release — see app/build/flatpak/README.md for the bundle-not-
    # Flathub scope this job stays inside. continue-on-error applies
    # per matrix leg, so an aarch64-only break (say Flathub has no
    # aarch64 GNOME 47 that week) still leaves x86_64 unaffected.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            flatpak_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            flatpak_arch: aarch64
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    env:
      APP_ID: io.github.gm5dna.open-rig-programmer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI and Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev flatpak flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # flatpak-builder --arch defaults to the host arch (confirmed
          # against flatpak-builder's own docs: the --arch flag exists
          # only to CROSS-build for a foreign arch, e.g. aarch64 from
          # an amd64 host, which this workflow never does — each leg
          # builds natively on a runner of that arch). Likewise
          # `flatpak install` with no --arch picks the running host's
          # arch, so this one command already installs the aarch64
          # GNOME 47 runtime on the arm runner with no extra flag; add
          # --arch=aarch64 explicitly only if that stops being true.
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: wails build (linux/${{ matrix.arch }})
        working-directory: app
        env:
          # Same reasoning as gui-linux: the GUI links GTK/WebKit via cgo.
          CGO_ENABLED: '1'
        run: wails build -tags webkit2_41 -ldflags "-X ${VERSION_PKG}.version=${VERSION}"

      - name: Copy the binary into the manifest's build context
        run: cp app/build/bin/open-rig-programmer app/build/flatpak/open-rig-programmer

      - name: flatpak-builder
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build-dir "app/build/flatpak/${APP_ID}.yml"

      - name: Build the single-file bundle
        run: flatpak build-bundle flatpak-repo "open-rig-programmer-${VERSION}-${{ matrix.flatpak_arch }}.flatpak" "${APP_ID}"

      - name: Check the bundle
        run: bash app/build/flatpak/check-flatpak.sh "open-rig-programmer-${VERSION}-${{ matrix.flatpak_arch }}.flatpak" "${APP_ID}"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-flatpak-${{ matrix.arch }}
          path: open-rig-programmer-*.flatpak
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag shape
        run: |
          set -eu
          # Every other job here has always assumed the tag pushed to
          # trigger this workflow (`on.push.tags: v*`) is well-formed;
          # this job is the first to check, and its failure blocks
          # `release:` (via `needs:` below) — deliberately, per the
          # design's decision 5.
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::tag ${VERSION} does not match ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\$"
            exit 1
          }
          NUMERIC=${VERSION#v}
          NUMERIC=${NUMERIC%%-*}
          echo "NUMERIC=$NUMERIC" >> "$GITHUB_ENV"
          echo "tag ${VERSION} -> numeric version ${NUMERIC}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tools on the image
        run: |
          set -eu
          jq --version
          command -v 7z
          # Not `7z i | head`: under this job's `defaults.run.shell: bash`
          # every run step is `bash -eo pipefail`, and `head` closing the
          # pipe early on 7z's (long) format-list output can raise SIGPIPE
          # in 7z and fail the step on nothing.
          7z i > /dev/null

      - name: Install NSIS 3.12
        run: |
          set -eu
          # Not on the windows-2025 image (Windows2025-Readme, read
          # 04/09/2026) — fetched from the official distribution, pinned
          # by sha256 (computed by the orchestrator 04/09/2026), same
          # version as the Mac's local makensis (3.12).
          curl -fsSL --retry 3 -o nsis-3.12.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip"
          wc -c nsis-3.12.zip
          echo "56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f  nsis-3.12.zip" | sha256sum -c
          7z x -y nsis-3.12.zip
          # A WINDOWS-NATIVE path, not the MSYS one Git Bash would derive
          # from $PWD: Go's exec.LookPath (which `wails build -nsis` uses
          # to find makensis) cannot see an MSYS `/d/a/...` path, and
          # `wails build -nsis` then silently skips the installer and
          # exits 0.
          # The single backslash reaching echo's argument comes from
          # double-quote stripping of "\\" (POSIX-defined), not from
          # echo's own non-portable escape interpretation, which is never
          # invoked here (no -e, no \n) — the disable below is that.
          # shellcheck disable=SC2028
          echo "${GITHUB_WORKSPACE}\\nsis-3.12" >> "$GITHUB_PATH"

      - name: makensis is visible
        shell: pwsh
        run: |
          $v = (makensis -VERSION)
          Write-Host "makensis -VERSION reports: $v"
          if ($v -ne "v3.12") {
            throw "makensis -VERSION printed '$v', want v3.12"
          }

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Stamp productVersion
        run: |
          set -eu
          # wails.json's info block deliberately omits productVersion (the
          # darwin job's Info.plist comment explains why); NSIS's
          # VIProductVersion and the PE VERSIONINFO both need a plain
          # X.Y.Z number, so it is written here, into the checkout only.
          jq --arg v "$NUMERIC" '.info.productVersion=$v' app/wails.json > tmp && mv tmp app/wails.json
          cat app/wails.json

      - name: Build rigprog.exe (amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o app/dist/amd64/rigprog.exe ./cmd/rigprog

      - name: Build rigprog.exe (arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w -X ${VERSION_PKG}.version=${VERSION}" -o app/dist/arm64/rigprog.exe ./cmd/rigprog

      - name: rigprog.exe reports the tag
        run: |
          set -eu
          # amd64 only: this x64 runner cannot run the arm64 slice, and
          # both arches take the same ldflags — proving the stamp on the
          # one that runs proves the mechanism (the darwin/linux jobs'
          # pattern).
          reported="$(app/dist/amd64/rigprog.exe version | head -1 | cut -d' ' -f2)"
          echo "rigprog.exe reports: ${reported} (tag: ${VERSION})"
          test "${reported}" = "${VERSION}"
          ! app/dist/amd64/rigprog.exe version | grep -q 'unreleased build'

      - name: rigprog.exe ports runs
        run: |
          set -eu
          app/dist/amd64/rigprog.exe ports

      - name: wails build (windows/amd64,windows/arm64) -nsis
        working-directory: app
        run: wails build -platform windows/amd64,windows/arm64 -nsis -ldflags "-X ${VERSION_PKG}.version=${VERSION}"

      - name: Installers exist
        working-directory: app
        run: |
          set -eu
          test -f "build/bin/Open Rig Programmer-amd64-installer.exe"
          test -f "build/bin/Open Rig Programmer-arm64-installer.exe"

      # This step is a diagnostic only, never a gate: on run 33950484060
      # (05/09/2026) .NET's FileVersionInfo came back EMPTY for both raw
      # GUI exes' ProductVersion even though the PE resource itself
      # (`.rsrc/0/version.txt`) carried the correct value — the
      # StringFileInfo block Wails writes is language-neutral
      # ("000004b0"), a shape FileVersionInfo does not resolve. The real
      # gate is `check-windows.sh`, which reads the resource bytes
      # directly (see its `check_version_resource` function) rather than
      # asking .NET. What Explorer's Properties → Details dialog shows
      # for these fields is left as a VM-leg checklist item
      # (`scripts/README-vm-leg.md`) rather than asserted here.
      - name: Version resource as .NET sees it (diagnostic)
        shell: pwsh
        working-directory: app
        run: |
          $numeric = $env:NUMERIC
          foreach ($arch in @("amd64", "arm64")) {
            $path = "build/bin/open-rig-programmer-$arch.exe"
            $info = (Get-Item $path).VersionInfo
            Write-Host "$path (want $numeric):"
            $info | Format-List FileVersion,ProductVersion,FileVersionRaw,ProductVersionRaw,FileDescription,ProductName
          }

      - name: Name the assets
        run: |
          set -eu
          mkdir -p out
          mv "app/build/bin/Open Rig Programmer-amd64-installer.exe" "out/open-rig-programmer-${VERSION}-windows-amd64-installer.exe"
          mv "app/build/bin/Open Rig Programmer-arm64-installer.exe" "out/open-rig-programmer-${VERSION}-windows-arm64-installer.exe"
          (cd app/dist/amd64 && 7z a "../../../out/rigprog-${VERSION}-windows-amd64.zip" rigprog.exe)
          (cd app/dist/arm64 && 7z a "../../../out/rigprog-${VERSION}-windows-arm64.zip" rigprog.exe)

      - name: Check the Windows assets
        run: bash app/build/windows/check-windows.sh "$VERSION" out

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    needs:
      - cli-darwin-universal
      - cli-linux
      - gui-darwin-universal
      - gui-linux
      - gui-linux-flatpak
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Write release notes
        run: |
          # Two independent passes: neither placeholder is a substring of
          # the other and neither replacement value contains a placeholder,
          # so the order is not load-bearing. __VERSION_NO_V__ exists
          # because deb filenames carry the version without the leading
          # "v"; every other artefact name carries the full tag.
          sed -e "s/__VERSION_NO_V__/${VERSION#v}/g" -e "s/__VERSION__/${VERSION}/g" .github/release-notes-template.md > release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            --draft \
            --title "Open Rig Programmer ${VERSION}" \
            --notes-file release-notes.md \
            artifacts/*
