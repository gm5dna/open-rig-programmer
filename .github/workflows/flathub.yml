# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds flathub/io.github.gm5dna.open-rig-programmer.yml from source
# (no prebuilt binary) inside the GNOME 50 flatpak-github-actions
# container, then runs flatpak-builder-lint against the manifest, the
# metainfo and the built repo. This replaces flathub-spike.yml (whose
# question — does org.gnome.Sdk//50 carry webkit2gtk-4.1? — is answered
# in reviews/phase0-webkit.md). Not the release pipeline: app/build/flatpak/*.yml
# still builds the prebuilt-binary bundle release.yml ships.
name: flathub

on:
  workflow_dispatch:
  push:
    branches: [flathub-spike]
  pull_request:
    paths:
      - 'flathub/**'

permissions:
  contents: read

env:
  APP_ID: io.github.gm5dna.open-rig-programmer
  MANIFEST: flathub/io.github.gm5dna.open-rig-programmer.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: flatpak-builder (build from source, no network in the sandbox)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: open-rig-programmer.flatpak
          repo-dir: repo
          cache-key: flathub-${{ hashFiles('flathub/**') }}

      - name: Pack the OSTree repo for the lint job
        run: tar -czf repo.tar.gz repo

      - name: Upload repo (for the repo lint check)
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo.tar.gz
          if-no-files-found: error

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: open-rig-programmer.flatpak
          if-no-files-found: error

      - name: Install xvfb for the launch smoke test
        # The flathub-infra/flatpak-github-actions image isn't
        # Debian/Ubuntu (apt-get: command not found, run 34886211358) —
        # try every common package manager and fall through if none
        # apply. check-flatpak.sh already treats a missing xvfb-run as
        # a graceful SKIP rather than a failure, so this never needs to
        # hard-fail the job over an unexpected base image.
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run already present"
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends xvfb
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y xorg-x11-server-Xvfb
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y xorg-x11-server-Xvfb
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache xvfb-run
          else
            echo "No known package manager found; check-flatpak.sh will skip the launch smoke gracefully"
          fi

      # Reuses the existing release-pipeline smoke script unmodified —
      # the GUI takes no --version flag (app/main.go calls wails.Run
      # with no flag parsing), so "does it launch and stay up" is the
      # same smoke check.check-flatpak.sh does for the release bundle.
      - name: Launch smoke test
        run: bash app/build/flatpak/check-flatpak.sh open-rig-programmer.flatpak "${APP_ID}"

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built repo
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo

      - name: Extract repo
        run: tar -xzf repo.tar.gz

      - name: lint manifest
        run: |
          docker run -v "$(pwd)":/mnt --rm ghcr.io/flathub-infra/flatpak-builder-lint:latest \
            manifest "/mnt/${MANIFEST}"

      - name: lint appstream
        # Expected to fail until a v1.8.2 tag exists: the metainfo
        # (branch flathub-meta) points its screenshot URLs at that tag
        # — see reviews/phase1-source-build.md. Kept as a real
        # (non-continue-on-error) step so it still fails loudly for
        # any *other* appstream regression; `lint repo` below still
        # runs regardless via `if: always()`.
        run: |
          docker run -v "$(pwd)":/mnt --rm ghcr.io/flathub-infra/flatpak-builder-lint:latest \
            appstream "/mnt/app/build/flatpak/${APP_ID}.metainfo.xml"

      - name: lint repo
        if: always()
        run: |
          docker run -v "$(pwd)":/mnt --rm ghcr.io/flathub-infra/flatpak-builder-lint:latest \
            repo "/mnt/repo"
